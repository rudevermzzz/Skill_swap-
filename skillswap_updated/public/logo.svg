<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Top Blue Person/Arrow Gradient -->
    <linearGradient id="ssBlueGrad" x1="15%" y1="10%" x2="90%" y2="70%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Bottom Green/Teal Person/Arrow Gradient -->
    <linearGradient id="ssTealGrad" x1="10%" y1="30%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Depth Shadows -->
    <filter id="ssShadowTop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
    <filter id="ssShadowBottom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="-3" stdDeviation="4" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- TOP BLUE PERSON & RIGHT ARROW -->
  <g filter="url(#ssShadowTop)">
    <!-- Head Circle -->
    <circle cx="78" cy="38" r="17" fill="url(#ssBlueGrad)" />

    <!-- Interlocking Ribbon Body & Arrow Pointing Right -->
    <path
      d="M 72 62
         C 70 82, 88 104, 122 104
         C 142 104, 156 96, 160 88
         L 160 97
         L 186 80
         L 160 63
         L 160 72
         C 146 72, 128 76, 110 68
         C 88 58, 80 46, 72 62 Z"
      fill="url(#ssBlueGrad)"
    />
  </g>

  <!-- BOTTOM GREEN PERSON & LEFT ARROW -->
  <g filter="url(#ssShadowBottom)">
    <!-- Head Circle -->
    <circle cx="122" cy="162" r="17" fill="url(#ssTealGrad)" />

    <!-- Interlocking Ribbon Body & Arrow Pointing Left -->
    <path
      d="M 128 138
         C 130 118, 112 96, 78 96
         C 58 96, 44 104, 40 112
         L 40 103
         L 14 120
         L 40 137
         L 40 128
         C 54 128, 72 124, 90 132
         C 112 142, 120 154, 128 138 Z"
      fill="url(#ssTealGrad)"
    />
  </g>
</svg>
